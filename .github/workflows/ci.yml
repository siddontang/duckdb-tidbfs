name: CI
on:
  workflow_dispatch:
    inputs:
      binary_run:
        description: Failed diagnostic run with matching Linux binaries
        type: string
        required: true
      trace_http:
        description: Capture payload-free HTTP syscalls
        type: choice
        options: ['1', '0']
        default: '1'
      server_nodelay:
        description: Disable Nagle on the test HTTP server
        type: choice
        options: ['0', '1']
        default: '0'
      receive_buffer:
        description: Override libcurl receive buffer in a test interposer
        type: choice
        options: ['16384', '65536', '262144']
        default: '16384'
permissions:
  contents: read
  actions: read
jobs:
  http-reproducer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUCKDB_AGENT_MODE: '0'
      TIDBFS_GDB_ON_TIMEOUT: '1'
      TIDBFS_TRACE_HTTP: ${{ inputs.trace_http }}
      TIDBFS_TEST_NODELAY: ${{ inputs.server_nodelay }}
      TIDBFS_TEST_CURL_BUFFER: ${{ inputs.receive_buffer }}
      BINARY_RUN: ${{ inputs.binary_run }}
      RUNTIME_SHA: 9619e391f8430774cdb47158afd2350a0fc8cc83
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify producer and reuse the exact unchanged runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BINARY_RUN" in *[!0-9]*|'') exit 1;; esac
          producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BINARY_RUN" --jq .head_sha)
          test "$producer" = "$RUNTIME_SHA"
          git diff --exit-code "$producer" HEAD -- src bridge CMakeLists.txt extension_config.cmake scripts/build.py scripts/build_extent.py
          gh run download "$BINARY_RUN" --name "http-timeout-$BINARY_RUN" --dir build
      - name: Install matching CLI and network diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev gdb strace
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL --retry 3 https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz -o "$RUNNER_TEMP/duckdb.tar.gz"
          printf '%s  %s\n' c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc "$RUNNER_TEMP/duckdb.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/duckdb.tar.gz" -C "$RUNNER_TEMP/duckdb"
          echo "DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          dpkg-query -W libcurl4t64 strace
          ldd build/tidbfs.duckdb_extension
      - name: Inspect TCP defaults and the original receive trace
        run: |
          sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.ipv4.tcp_moderate_rcvbuf
          python3 - <<'PYTRACE'
          from pathlib import Path
          for path in sorted(Path('build/http-traces').glob('*')):
              matches=[line for line in path.read_text().splitlines() if 'setsockopt' in line]
              if matches:
                  print(path.name, '\n'.join(matches[:12]))
          PYTRACE
      - name: Build the controlled receive-buffer interposer
        run: |
          cat > build/curl-buffer.c <<'CSHIM'
          #include <curl/curl.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          static CURLcode (*perform)(CURL *);
          static pthread_once_t once = PTHREAD_ONCE_INIT;
          static long buffer;
          static void resolve(void) {
              perform = (CURLcode (*)(CURL *))dlsym(RTLD_NEXT, "curl_easy_perform");
              buffer = strtol(getenv("TIDBFS_TEST_CURL_BUFFER"), NULL, 10);
              fprintf(stderr, "Test curl receive buffer: %ld\n", buffer);
          }
          CURLcode curl_easy_perform(CURL *curl) {
              pthread_once(&once, resolve);
              CURLcode code = curl_easy_setopt(curl, CURLOPT_BUFFERSIZE, buffer);
              return code == CURLE_OK ? perform(curl) : code;
          }
          CSHIM
          gcc -shared -fPIC -O2 build/curl-buffer.c -lcurl -ldl -pthread -o build/curl-buffer.so
          echo "LD_PRELOAD=$GITHUB_WORKSPACE/build/curl-buffer.so" >> "$GITHUB_ENV"
      - name: Reproduce the read stall with the original deadline
        run: |
          set -o pipefail
          "$DUCKDB" -unsigned -bail -c "LOAD 'build/tidbfs.duckdb_extension';"
          python3 -m unittest discover -s test -v 2>&1 | tee build/http-repro.log
          python3 scripts/stress_multipart.py --iterations 30 2>&1 | tee -a build/http-repro.log
      - name: Preserve traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-repro-${{ github.run_id }}
          retention-days: 7
          path: |
            build/http-traces/
            build/http-repro.log
